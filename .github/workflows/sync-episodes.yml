name: Sync episodes

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-episodes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync new episodes
        run: node scripts/sync-catalogue.mjs
        env:
          SYNC_COMMIT_MESSAGE: ${{ runner.temp }}/sync-commit-message.txt

      - name: Validate catalogue
        run: node scripts/validate-catalogue.mjs

      - name: Build site
        run: npm run build

      - name: Commit and push changes
        run: |
          if git diff --quiet -- app/shows.json; then
            echo "No new episodes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/shows.json
          git commit -F "$RUNNER_TEMP/sync-commit-message.txt"
          git push
